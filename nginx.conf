server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip untuk prestasi
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Page HTML sentiasa fresh supaya update terus nampak
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    # Halaman status bayaran BCL (URL bersih: /success /failed /pending)
    location ~ ^/(success|failed|pending)/?$ {
        add_header Cache-Control "no-cache";
        try_files /$1.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statik (gambar, video, dll)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
